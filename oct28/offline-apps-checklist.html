function draw(){const base=b.value;let h='',g={app:'Apps',game:'Games',other:'Other things (APKs and extension)'};let done=0;

h+='<div class="row'+(ok?' done':'')+'"><div class="n">'+esc(r.n)+'</div><div class="d">'+esc(r.d)+'</div>'+(r.net?'<div class="net">⚠ '+esc(r.net)+'</div>':'')+
'<div><a href="'+enc(base+r.loc)+'">'+(r.loc.endsWith('.apk')?'Install APK':r.loc.endsWith('/')?'Open folder':'Open offline')+'</a>'+(r.apk?'<a href="'+enc(base+r.apk)+'">Android APK</a>':'')+'<a href="'+r.live+'" target="_blank">Live web</a></div>'+
'<div class="ticks">'+[['ph','📱 Phone'],['pc','💻 PC'],['aw','⭐ Awesome'],['un','💎 Unique']].map(([k,l])=>'<label><input type="checkbox" data-id="'+r.id+'" data-k="'+k+'"'+(s[k]?' checked':'')+'> '+l+'</label>').join('')+'</div></div>';});}
document.getElementById('list').innerHTML=h;document.getElementById('cnt').textContent=done+' of '+R.length+' tested on both Phone and PC';}
document.addEventListener('change',e=>{const c=e.target;if(c.dataset.id){S[c.dataset.id][c.dataset.k]=c.checked;save();draw();}});
b.addEventListener('input',()=>{localStorage.setItem(K+'base',b.value);draw();});draw();
</script></body></html>
