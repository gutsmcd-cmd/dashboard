<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animal Senses Explorer / 動物の感覚探検</title>
<meta name="description" content="Offline English/Japanese guide to how selected animals sense the world, with human comparisons and a short quiz. No network required.">
<style>
:root {
  --bg: #f4f1ec;
  --bg-2: #eef3ee;
  --card: #fffdf9;
  --ink: #1e2a24;
  --muted: #4a5850;
  --pink: #8e4d5c;
  --pink-soft: #f3e6e9;
  --green: #3c6a51;
  --green-soft: #e3eee7;
  --line: #d7cfc6;
  --focus: #21543a;
  --shadow: 0 8px 24px rgba(30, 42, 36, 0.07);
  --radius: 16px;
  --max: 920px;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
html, body { margin: 0; padding: 0; background: linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%); color: var(--ink); }
body {
  font: 17px/1.55 system-ui, "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
  min-height: 100vh;
}
:focus { outline: none; }
:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 3px;
}
.skip {
  position: absolute; left: 12px; top: -48px; background: var(--ink); color: #fff;
  padding: 8px 12px; border-radius: 8px; z-index: 20;
}
.skip:focus { top: 12px; }
header.app {
  position: sticky; top: 0; z-index: 2;
  background: rgba(244, 241, 236, 0.94);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.wrap { width: min(var(--max), calc(100% - 32px)); margin: 0 auto; }
header.app .wrap { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center; padding: 12px 0; }
h1 { font-size: 1.15rem; margin: 0; letter-spacing: -0.02em; }
h1 span { display: block; color: var(--muted); font-weight: 500; font-size: 0.78rem; }
.tools { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg, .lang {
  display: inline-flex; background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 3px;
}
.seg button, .lang button {
  appearance: none; border: 0; background: transparent; color: var(--ink);
  font: inherit; font-size: 0.9rem; padding: 8px 14px; border-radius: 999px; cursor: pointer; min-height: 40px;
}
.seg button[aria-pressed="true"], .lang button[aria-pressed="true"] {
  background: var(--green); color: #fff;
}
main { padding: 20px 0 72px; }
.lede { margin: 0 0 18px; color: var(--muted); max-width: 46rem; }
.note {
  background: var(--green-soft); border-left: 4px solid var(--green);
  padding: 10px 14px; border-radius: 0 12px 12px 0; margin: 0 0 18px; color: var(--ink); font-size: 0.95rem;
}
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 18px; }
.filters button {
  appearance: none; border: 1px solid var(--line); background: #fff; color: var(--ink);
  font: inherit; font-size: 0.88rem; padding: 8px 12px; border-radius: 999px; cursor: pointer; min-height: 40px;
}
.filters button[aria-pressed="true"] { background: var(--pink-soft); border-color: #e0c5cb; color: var(--pink); font-weight: 600; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.card {
  display: flex; flex-direction: column; align-items: flex-start; text-align: left;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px; box-shadow: var(--shadow); cursor: pointer; width: 100%; font: inherit; color: inherit;
  min-height: 148px;
}
.card:hover { border-color: #c9b8ae; }
.badge {
  display: inline-flex; align-items: center; justify-content: center;
  width: 42px; height: 42px; border-radius: 12px; font-weight: 700; margin-bottom: 10px;
  background: var(--pink-soft); color: var(--pink);
}
.card h2 { font-size: 1.05rem; margin: 0 0 2px; }
.latin { margin: 0 0 8px; color: var(--muted); font-size: 0.8rem; font-style: italic; }
.tag {
  display: inline-block; margin-top: auto; background: var(--green-soft); color: var(--green);
  font-size: 0.8rem; font-weight: 600; padding: 4px 8px; border-radius: 999px;
}
dialog {
  border: 0; padding: 0; background: transparent;
  max-width: min(720px, calc(100% - 24px)); width: 100%;
  margin: auto; max-height: calc(100vh - 24px);
}
dialog::backdrop { background: rgba(30, 42, 36, 0.5); }
.sheet {
  background: var(--card); border-radius: 20px; padding: 22px 22px 28px;
  box-shadow: 0 16px 48px rgba(30, 42, 36, 0.2);
  max-height: calc(100vh - 24px); overflow: auto;
}
.sheet-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.sheet h2 { margin: 0; font-size: 1.4rem; }
.close {
  appearance: none; border: 1px solid var(--line); background: #fff; border-radius: 999px;
  width: 44px; height: 44px; font-size: 1.4rem; cursor: pointer; color: var(--ink); flex: none;
}
.sense { margin: 16px 0; padding: 12px 14px; background: var(--bg); border-radius: 12px; }
.sense h3 { margin: 0 0 6px; font-size: 1rem; color: var(--green); }
.sense p, .compare p, .sources p { margin: 0; }
.compare { margin: 16px 0; padding: 12px 14px; background: var(--pink-soft); border-radius: 12px; }
.compare h3 { margin: 0 0 6px; font-size: 1rem; color: var(--pink); }
.sources { margin: 16px 0 0; }
.sources h3 { margin: 0 0 8px; font-size: 1rem; }
.sources ul { margin: 0; padding: 0 0 0 1.1rem; }
.sources a { color: var(--green); }
.online-flag { display: block; font-size: 0.85rem; color: var(--muted); margin: 0 0 8px; }
.quiz { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
.progress { color: var(--muted); font-size: 0.9rem; margin: 0 0 8px; }
.quiz h2 { margin: 0 0 14px; font-size: 1.2rem; }
.choices { display: grid; gap: 8px; margin: 0 0 14px; }
.choice {
  display: flex; gap: 10px; align-items: flex-start; background: #fff; border: 1px solid var(--line);
  border-radius: 12px; padding: 10px 12px; cursor: pointer;
}
.choice:hover { border-color: #c9b8ae; }
.choice input { margin-top: 4px; inline-size: 18px; block-size: 18px; accent-color: var(--green); flex: none; }
.choice.correct { border-color: var(--green); background: var(--green-soft); }
.choice.wrong { border-color: var(--pink); background: var(--pink-soft); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  appearance: none; border: 0; background: var(--green); color: #fff; font: inherit; font-weight: 600;
  padding: 10px 16px; border-radius: 999px; cursor: pointer; min-height: 44px;
}
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.btn.secondary { background: #fff; color: var(--ink); border: 1px solid var(--line); }
.feedback { margin: 12px 0 0; padding: 10px 12px; border-radius: 12px; background: var(--bg); min-height: 1.5em; }
.score { font-size: 1.15rem; margin: 0 0 10px; }
footer {
  border-top: 1px solid var(--line); padding: 20px 0 28px; color: var(--muted); font-size: 0.9rem;
}
footer h2 { color: var(--ink); font-size: 1rem; margin: 0 0 8px; }
.hidden { display: none !important; }
@media (max-width: 560px) {
  .wrap { width: min(var(--max), calc(100% - 24px)); }
  header.app .wrap { padding: 10px 0; }
  h1 { font-size: 1.02rem; }
  .tools { margin-left: 0; width: 100%; }
  .seg, .lang { flex: 1; justify-content: center; }
  .seg button, .lang button { flex: 1; }
  dialog { max-width: calc(100% - 16px); margin: 10px auto; max-height: calc(100vh - 20px); }
  .sheet { max-height: calc(100vh - 20px); padding: 16px 16px 22px; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  * { transition: none !important; }
}
</style>
</head>
<body>
<a class="skip" href="#main" data-i="skip">Skip to main content</a>
<header class="app">
  <div class="wrap">
    <h1 id="app-title"><span data-i="title">Animal Senses Explorer</span><span data-i="tagline">How animals sense the world — compared with typical human senses</span></h1>
    <div class="tools">
      <div class="lang" role="group" aria-label="Language">
        <button type="button" id="btn-en" aria-pressed="true">EN</button>
        <button type="button" id="btn-ja" aria-pressed="false">日本語</button>
      </div>
      <div class="seg" role="tablist" aria-label="Mode">
        <button type="button" role="tab" id="tab-explore" aria-selected="true" aria-controls="panel-explore" data-i="explore">Explore</button>
        <button type="button" role="tab" id="tab-quiz" aria-selected="false" aria-controls="panel-quiz" data-i="quiz">Quiz</button>
      </div>
    </div>
  </div>
</header>
<main id="main" class="wrap">
  <section id="panel-explore" role="tabpanel" aria-labelledby="tab-explore">
    <p class="lede" data-i="lede"></p>
    <p class="note" data-i="note"></p>
    <div class="filters" id="filters" role="group" aria-label="Filter"></div>
    <div class="grid" id="grid"></div>
  </section>
  <section id="panel-quiz" class="hidden" role="tabpanel" aria-labelledby="tab-quiz">
    <p class="note" data-i="quizNote"></p>
    <div class="quiz" id="quiz"></div>
  </section>
</main>
<footer>
  <div class="wrap">
    <h2 data-i="srcFootTitle">Sources (optional, online)</h2>
    <p data-i="srcFoot"></p>
    <p data-i="offlineFoot"></p>
  </div>
</footer>
<dialog id="detail" aria-labelledby="detail-title">
  <div class="sheet">
    <div class="sheet-top">
      <div>
        <h2 id="detail-title"></h2>
        <p class="latin" id="detail-latin"></p>
      </div>
      <button type="button" class="close" id="detail-close" aria-label="Close">×</button>
    </div>
    <div id="detail-body"></div>
  </div>
</dialog>
<script>
const I18N = {

    close: "Close",

    lede: "感覚の研究がよく進んでいる動物を16種紹介します。カードを開くと、わかりやすい説明、人の標準的な感覚との比較、確認に使った資料への任意リンクが出ます。",
    note: "このページは通信なしで使えます。「何倍すぐれている」といった数値の順位は根拠が揺れやすいので、ここでは性質の説明にとどめています。人の感覚にも個人差があります。",
    quizNote: "各問の正解はひとつで、図鑑の内容に沿っています。選択肢の順番は毎回入れ替えるので、正解が同じ位置に偏りません。資料リンクは任意で、開くには通信が必要です。",
    srcFootTitle: "資料（任意・オンライン）",
    srcFoot: "各カードに、事実の確認に使った公開ページ（博物館、大学、公的な科学ページ、研究の要約）を載せています。これらのリンクには通信が必要で、閲覧やクイズには不要です。",
    offlineFoot: "「動物の感覚探検」はオフラインの単一ファイルです。アプリ本体はアカウントも追加ダウンロードも通信機能も使いません。",
    close: "閉じる",
    human: "人の標準的な感覚との比較",
    sources: "資料",
    online: "これらのリンクはインターネットで開きます。アプリの利用に必須ではありません。",
    all: "すべて",
    open: "詳細を開く：",
    progress: "問題 {n} / {total}",
    check: "答を確かめる",
    next: "次の問題",
    again: "もう一度",
    choose: "先に選択肢を選んでください。",
    right: "正解です。",
    wrong: "違います。",
    score: "{total} 問中 {score} 問正解でした。",
    empty: "このグループには動物がありません。",
    filter: "感覚で絞り込む",
    seeScore: "結果を見る"
  }
};

const ANIMALS = [
  {
    id: "dog", letter: "D", filter: ["smell"],
    name: {en: "Dog", ja: "イヌ"},
    latin: "Canis familiaris",
    tag: {en: "Smell", ja: "嗅覚"},
    senses: [
      {h:{en:"A nose built for tracking", ja:"道筋をたどる鼻"},
       p:{en:"Dogs have a large smelling surface in the nose and a well-developed smell-processing region of the brain. Many can follow a faint scent trail that a typical person would not notice. They also have a vomeronasal organ that helps them sample certain chemical signals used in animal communication.",
          ja:"イヌは鼻の中のにおいを感じる面が広く、脳のにおいを処理する部位もよく発達しています。人が気づかないような薄いにおいの跡をたどれることがよくあります。また、ヤコブソン器官（鋤鼻器）があり、動物同士の化学的な合図を探るのにも役立ちます。"}}
    ],
    compare: {en:"A typical person leans on sight much more than smell. Human smell is real and useful, but it is not built to sort and follow individual odors in a mixed scent trail the way a dog’s nose is.",
              ja:"人はふつう、においより視覚に頼ります。人の嗅覚も役に立ちますが、混ざったにおいの中から特定の道筋を追い続けるようには、イヌの鼻ほど特化していません。"},
    sources: [
      {label:"Canine olfaction review (PMC)", url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC8388720/"}
    ]
  },
  {
    id: "cat", letter: "C", filter: ["hearing","sight","touch"],
    name: {en: "Cat", ja: "ネコ"},
    latin: "Felis catus",
    tag: {en: "Hearing, dim-light sight, whiskers", ja: "聴覚・薄明視・ひげ"},
    senses: [
      {h:{en:"High, quiet sounds", ja:"高くて小さな音"},
       p:{en:"Cats can hear much higher-pitched sounds than a typical adult person. That range helps them notice squeaks and rustles from small prey.",
          ja:"ネコは、標準的な大人の人よりもずっと高い音まで聞こえます。小動物の鳴き声や草の音に気づくのに役立ちます。"}},
      {h:{en:"A mirror behind the retina", ja:"網膜の奥の反射層"},
       p:{en:"A reflective layer called the tapetum lucidum sends leftover light back through the light-sensing cells. This helps in dim conditions and can make the eyes shine.",
          ja:"タペタム（tapetum lucidum）という反射層が、使い残した光を視細胞へ戻します。暗い場所での見え方を助け、目が光って見える原因にもなります。"}},
      {h:{en:"Whiskers as feelers", ja:"触覚としてのひげ"},
       p:{en:"Long whiskers (vibrissae) are richly supplied with nerves. They help a cat judge nearby objects, moving air, and whether a gap is wide enough — even when the light is poor.",

    ],
    compare: {en:"People usually hear a narrower band of very high sounds and have no tapetum lucidum, so a dim room often looks darker to us. Ordinary facial hair is not a specialized feeler system like whiskers.",
              ja:"人の聴こえる高い音の範囲はネコより狭く、タペタムもないため、同じ薄暗い部屋でも人の方が暗く感じやすいです。人の顔の毛は、ネコのひげのような専用の触覚器官ではありません。"},
    sources: [
      {label:"Texas A&M Veterinary Medicine: a cat’s five senses", url:"https://vetmed.tamu.edu/news/pet-talk/a-cats-five-senses/"},
      {label:"Natural History Museum: cat anatomy (whiskers)", url:"https://nhm.org/stories/cat-anatomy"}
    ]
  },
  {
    id: "barn-owl", letter: "O", filter: ["hearing"],
    name: {en: "Barn owl", ja: "メンフクロウ"},
    latin: "Tyto alba",
    tag: {en: "Precise hearing in the dark", ja: "暗闇での精密な聴覚"},
    senses: [
      {h:{en:"A face that collects sound", ja:"音を集める顔"},
       p:{en:"A heart-shaped facial disc funnels sound toward the ears. The ear openings differ in height and shape, so a sound arrives slightly differently at each ear. The owl’s brain uses those differences to judge both direction and height. Experiments have shown barn owls can catch prey in total darkness by hearing alone.",
          ja:"ハート形の顔（顔盤）が音を耳へ送ります。耳の穴の高さや形が左右で違うため、同じ音でも届き方がわずかに異なります。脳はその差から、音の左右だけでなく高さも判断します。実験では、全くの暗闇でも聴覚だけで獲物を捕まえられることが示されています。"}}
    ],
    compare: {en:"Human ears sit at roughly the same height. We can often tell left from right, but we are less precise at judging the height of a faint rustle, and we cannot typically hunt by hearing in complete darkness.",
              ja:"人の耳はほぼ同じ高さにあります。左右の判断はできても、かすかな音の高さを精密に知ることは苦手で、真っ暗闇で音だけを頼りに狩ることはふつうできません。"},
    sources: [
      {label:"Barn Owl Trust: hearing adaptations", url:"https://www.barnowltrust.org.uk/barn-owl-facts/barn-owl-adaptations/"},
      {label:"Stanford Birds: how owls hunt in the dark", url:"https://web.stanford.edu/group/stanfordbirds/text/essays/How_Owls_Hunt.html"}
    ]
  },
  {
    id: "bat", letter: "B", filter: ["hearing","echolocation"],

    senses: [

    ],
    compare: {en:"Typical human hearing does not reach these ultrasonic calls. A few people practice click-based echolocation, but bats have a dedicated biosonar system used in nightly flight and hunting.",

    sources: [
      {label:"U.S. National Park Service: bat echolocation", url:"https://www.nps.gov/subjects/bats/echolocation.htm"}
    ]
  },
  {

    name: {en: "Bottlenose dolphin", ja: "ハンドウイルカ"},

       p:{en:"Bottlenose dolphins make high-frequency echolocation clicks. The clicks are focused through a fatty organ in the forehead (the melon). Returning echoes are received through the lower jaw and passed to the ear. This biosonar helps them find prey and explore even when the water is murky.",

    ],
    compare: {en:"People do not have a melon or a jaw pathway for echoes. Underwater, both human sight and hearing are limited, and we need tools if we want a similar picture of hidden objects.",

    sources: [
      {label:"Smithsonian Ocean: evolution of echolocation", url:"https://ocean.si.edu/ocean-life/marine-mammals/evolution-echolocation"},
      {label:"NOAA Fisheries: common bottlenose dolphin", url:"https://www.fisheries.noaa.gov/species/common-bottlenose-dolphin"}
    ]
  },
  {
    id: "elephant", letter: "E", filter: ["hearing","smell","touch"],
    name: {en: "African elephant", ja: "アフリカゾウ"},
    latin: "Loxodonta africana",

let lang = "en";
let filter = "all";
let quiz = null;
let openId = null;

function t(key) { return I18N[lang][key]; }
function tr(obj) { return obj[lang]; }

function applyI18n() {
  document.documentElement.lang = lang === "ja" ? "ja" : "en";
  document.querySelectorAll("[data-i]").forEach(el => {
    const key = el.getAttribute("data-i");
    if (I18N[lang][key] != null) el.textContent = I18N[lang][key];
  });
  document.getElementById("btn-en").setAttribute("aria-pressed", String(lang === "en"));
  document.getElementById("btn-ja").setAttribute("aria-pressed", String(lang === "ja"));
  document.getElementById("detail-close").setAttribute("aria-label", t("close"));
  renderFilters();
  renderGrid();
  if (quiz) renderQuiz();
  const dlg = document.getElementById("detail");
  if (openId && dlg.open) openDetail(openId);
}

function renderFilters() {
  const box = document.getElementById("filters");
  box.setAttribute("aria-label", t("filter"));
  box.innerHTML = FILTERS.map(f =>
    `<button type="button" data-filter="${f.id}" aria-pressed="${f.id===filter}">${lang==="ja"?f.ja:f.en}</button>`
  ).join("");
  box.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => { filter = btn.dataset.filter; renderFilters(); renderGrid(); });
  });
}

function renderGrid() {
  const grid = document.getElementById("grid");
  const list = ANIMALS.filter(a => filter === "all" || a.filter.includes(filter));
  if (!list.length) {
    grid.innerHTML = `<p>${t("empty")}</p>`;
    return;
  }
  grid.innerHTML = list.map(a => `
    <button type="button" class="card" data-id="${a.id}" aria-label="${t("open")} ${tr(a.name)}">
      <span class="badge" aria-hidden="true">${a.letter}</span>
      <h2>${tr(a.name)}</h2>
      <p class="latin">${a.latin}</p>
      <span class="tag">${tr(a.tag)}</span>
    </button>`).join("");
  grid.querySelectorAll(".card").forEach(btn => btn.addEventListener("click", () => openDetail(btn.dataset.id)));
}

function openDetail(id) {
  const a = ANIMALS.find(x => x.id === id);
  if (!a) return;
  openId = id;
  document.getElementById("detail-title").textContent = tr(a.name);
  document.getElementById("detail-latin").textContent = a.latin;
  const senses = a.senses.map(s => `<article class="sense"><h3>${tr(s.h)}</h3><p>${tr(s.p)}</p></article>`).join("");
  const links = a.sources.map(s => `<li><a href="${s.url}" target="_blank" rel="noopener noreferrer">${s.label}</a></li>`).join("");
  document.getElementById("detail-body").innerHTML = `
    ${senses}
    <section class="compare"><h3>${t("human")}</h3><p>${tr(a.compare)}</p></section>
    <section class="sources">
      <h3>${t("sources")}</h3>
      <span class="online-flag">${t("online")}</span>
      <ul>${links}</ul>
    </section>`;
  const dlg = document.getElementById("detail");
  if (!dlg.open) dlg.showModal();
  document.getElementById("detail-close").focus();
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startQuiz() {
  quiz = {
    items: shuffle(QUESTIONS).map(q => ({...q, options: shuffle(q.options), picked: null, checked: false})),
    i: 0,
    score: 0,
    done: false
  };
  renderQuiz();
}

function renderQuiz() {
  const box = document.getElementById("quiz");
  if (!quiz) { startQuiz(); return; }
  if (quiz.done) {
    box.innerHTML = `
      <p class="score">${t("score").replace("{score}", quiz.score).replace("{total}", quiz.items.length)}</p>
      <button type="button" class="btn" id="again">${t("again")}</button>`;
    document.getElementById("again").addEventListener("click", startQuiz);
    return;
  }
  const item = quiz.items[quiz.i];
  const prog = t("progress").replace("{n}", quiz.i+1).replace("{total}", quiz.items.length);
  const choices = item.options.map((o, idx) => {
    const cls = item.checked ? (o.ok ? "choice correct" : (item.picked===o.id ? "choice wrong" : "choice")) : "choice";
    return `<label class="${cls}"><input type="radio" name="ans" value="${o.id}" ${item.picked===o.id?"checked":""} ${item.checked?"disabled":""}><span>${tr(o.t)}</span></label>`;
  }).join("");
  let fb = "";
  if (item.checked) {
    const ok = item.options.find(o => o.id === item.picked)?.ok;
    fb = `<p class="feedback" role="status">${ok ? t("right") : t("wrong")} ${tr(item.explain)}</p>`;
  } else {
    fb = `<p class="feedback" role="status" id="quiz-fb"></p>`;
  }
  box.innerHTML = `
    <p class="progress">${prog}</p>
    <h2 id="q-title">${tr(item.q)}</h2>
    <div class="choices" role="radiogroup" aria-labelledby="q-title">${choices}</div>
    <div class="actions">
      ${item.checked
        ? `<button type="button" class="btn" id="next">${quiz.i===quiz.items.length-1 ? t("seeScore") : t("next")}</button>`
        : `<button type="button" class="btn" id="check">${t("check")}</button>`}
    </div>
    ${fb}`;
  if (!item.checked) {
    box.querySelectorAll('input[name="ans"]').forEach(inp => {
      inp.addEventListener("change", () => { item.picked = inp.value; });
    });
    document.getElementById("check").addEventListener("click", () => {
      if (!item.picked) {
        document.getElementById("quiz-fb").textContent = t("choose");
        return;
      }
      item.checked = true;
      if (item.options.find(o => o.id === item.picked)?.ok) quiz.score += 1;
      renderQuiz();
    });
  } else {
    const next = document.getElementById("next");
    next.addEventListener("click", () => {
      if (quiz.i === quiz.items.length - 1) quiz.done = true;
      else quiz.i += 1;
      renderQuiz();
    });
  }
}

function showPanel(name) {
  const explore = name === "explore";
  document.getElementById("panel-explore").classList.toggle("hidden", !explore);
  document.getElementById("panel-quiz").classList.toggle("hidden", explore);
  document.getElementById("tab-explore").setAttribute("aria-selected", String(explore));
  document.getElementById("tab-quiz").setAttribute("aria-selected", String(!explore));
  window.scrollTo(0, 0);
  if (!explore && !quiz) startQuiz();
}

document.getElementById("btn-en").addEventListener("click", () => { lang = "en"; applyI18n(); });
document.getElementById("btn-ja").addEventListener("click", () => { lang = "ja"; applyI18n(); });
document.getElementById("tab-explore").addEventListener("click", () => showPanel("explore"));
document.getElementById("tab-quiz").addEventListener("click", () => showPanel("quiz"));
function closeDetail() {
  openId = null;
  document.getElementById("detail").close();
}
document.getElementById("detail-close").addEventListener("click", closeDetail);
document.getElementById("detail").addEventListener("click", (e) => {
  if (e.target.id === "detail") closeDetail();
});
document.getElementById("detail").addEventListener("close", () => { openId = null; });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && document.getElementById("detail").open) closeDetail();
});

applyI18n();
</script>
