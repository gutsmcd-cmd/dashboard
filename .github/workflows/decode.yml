name: decode-site
on:
  push:
    branches: [main]
    paths: ['b64/done']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild site from base64 parts
        run: |
          set -e
          if [ ! -f b64/done ]; then echo "waiting for all parts"; exit 0; fi
          cat b64/site.part* | base64 -d > /tmp/site.tar
          echo "$(cat b64/sha256)  /tmp/site.tar" | sha256sum -c -
          tar -xf /tmp/site.tar
          git rm -r -q b64
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild site from uploaded parts"
          git push origin HEAD:main
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then git push --force origin HEAD:gh-pages; fi
